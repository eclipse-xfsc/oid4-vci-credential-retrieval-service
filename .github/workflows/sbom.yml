name: Trigger Remote SBOM Workflow

on:
  release:
    types: [published]
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  call-remote-workflow:
    uses: eclipse-xfsc/dev-ops/.github/workflows/sbom-golang.yml@main
    secrets:
      GH_TOKEN: ${{ github.GITHUB_TOKEN }}
