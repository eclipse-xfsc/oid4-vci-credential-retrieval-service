version: "3.9"

services:
  # server:
  #   image: ${IMAGE_REPO}:${IMAGE_TAG}
  #   build:
  #     context: ../../.
  #     dockerfile: ./deployment/docker/Dockerfile
  #   env_file:
  #     - ../../.env
