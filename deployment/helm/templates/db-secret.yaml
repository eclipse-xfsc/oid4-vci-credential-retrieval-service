{{- $secretName := printf "%s-cassandra-credentials" .Release.Name -}}
{{- $externalSecretName := printf "%s-cassandra-credentials" .Release.Name -}}
{{- $remoteKey := "ocm-wstack/system/cassandra" -}}
{{- if eq (index .Values.podAnnotations "inject.xfsc.io/enabled") "true" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $externalSecretName }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: openbao
    kind: SecretStore

  target:
    name: {{ $secretName }}
    creationPolicy: Owner
    deletionPolicy: Delete

  data:
    - secretKey: username
      remoteRef:
        key: {{ $remoteKey | quote }}
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore

    - secretKey: password
      remoteRef:
        key: {{ $remoteKey | quote }}
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end }}