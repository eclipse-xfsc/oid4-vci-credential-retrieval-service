apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.name" . | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

    spec:
      securityContext:
        {{- include "app.securitycontext" . | nindent 8 }}

      imagePullSecrets:
        - name: {{ .Values.image.pullSecrets | quote }}

      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}/{{ .Values.image.name }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}

          env:
            {{- $podAnnotations := default dict .Values.podAnnotations }}
            {{- $injectionEnabled := eq (default "false" (index $podAnnotations "inject.xfsc.io/enabled")) "true" }}

            # ------------------------------------------------------------
            # Allgemeine Konfiguration
            # ------------------------------------------------------------

            - name: CREDENTIALRETRIEVAL_MIGRATIONS_TABLE
              value: "retrieval_schema_migration"

            - name: CREDENTIALRETRIEVAL_DISABLETLS
              value: {{ .Values.config.disableTLS | quote }}

            - name: CREDENTIALRETRIEVAL_OFFERING_TOPIC
              value: {{ .Values.config.offeringTopic | quote }}

            - name: CREDENTIALRETRIEVAL_OFFERINGPOLICY
              value: {{ .Values.config.offeringPolicy | quote }}

            - name: CREDENTIALRETRIEVAL_METADATAPOLICY
              value: {{ .Values.config.metadataPolicy | quote }}

            - name: CREDENTIALRETRIEVAL_LISTEN_PORT
              value: {{ .Values.service.port | quote }}

            - name: CREDENTIALRETRIEVAL_LISTEN_ADDR
              value: {{ .Values.service.addr | quote }}

            - name: CREDENTIALRETRIEVAL_COUNTRY
              value: {{ .Values.config.country | quote }}

            - name: CREDENTIALRETRIEVAL_REGION
              value: {{ .Values.config.region | quote }}

            - name: CREDENTIALRETRIEVAL_NATS_QUEUE_GROUP
              value: {{ .Values.config.nats.queuegroup | quote }}
            # ------------------------------------------------------------
            # Injection deaktiviert
            # Werte werden vollständig aus values.yaml übernommen
            # ------------------------------------------------------------

            {{- if not $injectionEnabled }}

            # NATS

            - name: CREDENTIALRETRIEVAL_NATS_URL
              value: {{ .Values.config.nats.url | quote }}

            - name: CREDENTIALRETRIEVAL_NATS_REQUEST_TIMEOUT
              value: {{ .Values.config.nats.requestTimeOut | quote }}

            # Cassandra

            {{- with .Values.config.cassandra }}
            - name: CREDENTIALRETRIEVAL_CASSANDRA_HOST
              value: {{ .hosts | quote }}

            - name: CREDENTIALRETRIEVAL_CASSANDRA_USER
              value: {{ .user | quote }}

            - name: CREDENTIALRETRIEVAL_CASSANDRA_KEYSPACE
              value: {{ .keyspace | quote }}

            - name: CREDENTIALRETRIEVAL_CASSANDRA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .passwordSecret | quote }}
                  key: {{ .passwordKey | quote }}
            {{- end }}

            # Signer

            - name: CREDENTIALRETRIEVAL_SIGNER_TOPIC
              value: {{ .Values.config.signerTopic | quote }}

            {{- with .Values.config.signer }}
            - name: CREDENTIALRETRIEVAL_SIGNER_URL
              value: {{ .url | quote }}
            {{- end }}

            # Storage

            - name: CREDENTIALRETRIEVAL_STORAGE_TOPIC
              value: {{ .Values.config.storageTopic | quote }}

            {{- else }}
            - name: CREDENTIALRETRIEVAL_CASSANDRA_USER
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-cassandra-credentials" .Release.Name | quote }}
                  key: username

            - name: CREDENTIALRETRIEVAL_CASSANDRA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-cassandra-credentials" .Release.Name | quote }}
                  key: password

            {{- end }}

          ports:
            - name: http
              containerPort: {{ .Values.service.port }}

          readinessProbe:
            httpGet:
              path: /v1/metrics/health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
            successThreshold: 2
            failureThreshold: 2
            timeoutSeconds: 5